name: Update ID News

on:
  schedule:
    # 4시간 간격(UTC 기준 :47). 인도네시아 매체에는 의료 AI 전담 지면이 없어
    # 수확이 드물다(scripts/fetch-id-news.mjs 머리말 참고) — 러시아어판처럼
    # 매시간 돌 이유가 없다. 정각·:17·:37은 다른 워크플로가 몰려 있어 비켜 둔다.
    - cron: '47 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write # 커밋·푸시
  actions: write # deploy.yml 수동 트리거(gh workflow run)

# 자기 자신의 중복 실행만 직렬화한다. deploy.yml의 'pages' 그룹이나 다른
# update-*.yml 그룹과 공유하지 않는다 — 공유하면 오너의 수동 배포 대기를
# 취소해 버릴 수 있다(update-ru-news.yml과 같은 이유).
concurrency:
  group: update-id-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 수집 실패(사이트 장애 등)는 오류로 남기지 않는다 — 파일이 안 바뀌므로
      # 아래 커밋 단계가 '변경 없음'으로 안전하게 끝난다.
      - name: 인도네시아어판 뉴스 수집 (신규 기사 누적)
        run: node scripts/fetch-id-news.mjs || echo "수집 건너뜀(기존 목록 유지)"

      - name: id/news.json 커밋 (변경 있을 때만)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/id/news.json
          if git diff --cached --quiet; then
            echo "새 기사 없음 — 커밋·배포 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "유지보수: 인도네시아어판 AI 뉴스 자동 업데이트"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포 트리거 (deploy.yml)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
