name: Update Portal Beds

on:
  schedule:
    # 3시간마다(UTC :11 — 다른 워크플로가 몰린 정각·:07·:17·:37·:47·:53은 비킨다). 병원이 입력하는 병상 값은 수시로 바뀌지만
    # 이 페이지는 정적 배포라 몇 시간 간격이면 충분하고, 공공데이터포털 하루 호출 한도(개발계정 1,000건)에도 한 번에 2건뿐이라 넉넉하다.
    - cron: '11 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write # 커밋·푸시
  actions: write # deploy.yml 수동 트리거(gh workflow run)

# 자기 자신의 중복 실행만 직렬화한다(다른 update-*.yml·deploy.yml 그룹과 공유하지 않는다).
concurrency:
  group: update-beds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 인증키(DATA_GO_KR_KEY)가 없거나 수집이 실패하면 파일이 안 바뀌므로 아래 커밋 단계가 '변경 없음'으로 끝난다.
      - name: 전국 응급의료기관 병상가동현황 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-beds.mjs || echo "수집 건너뜀(기존 자료 유지)"

      - name: portal/beds.json 커밋 (변경 있을 때만)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portal/beds.json
          if git diff --cached --quiet; then
            echo "병상 값 변동 없음 — 커밋·배포 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "유지보수: 공공 포털 병상가동현황 자동 업데이트"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포 트리거 (deploy.yml)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
