name: Probe HIRA OpenAPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 비급여 수집기 시험(시도별 1쪽)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NPAY_MAX_PAGES: '1'
          NPAY_PAGE: '500'
        run: |
          node scripts/probe-npay.mjs
