name: Update Portal Npay

on:
  schedule:
    # 매일 세 번(UTC 02:41·10:41·18:41 = 한국시간 11:41·19:41·03:41) 확인한다. 마지막 갱신이 6일 안이면 바로 끝내고, 아니면 새로 받는다(= 실제로는 주 1회).
    # 비급여 가격 API(getNonPaymentItemHospDtlList)가 공공데이터포털 쪽 시간 초과(504)로 며칠씩 안 되는 일이 있어, 주 1회 한 번만 시도하지 않고
    # 성공할 때까지 매일 다시 시도하게 했다. 다른 워크플로가 몰린 정각·:07·:17·:37·:47·:53은 비킨다.
    - cron: '41 2,10,18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '6일이 안 지났어도 지금 새로 받기'
        type: boolean
        default: false

permissions:
  contents: write # portal-npay 브랜치 푸시

# 자기 자신의 중복 실행만 직렬화한다. 사이트를 다시 배포하지 않는다 — 결과는 portal-npay 브랜치(index.json + items/<코드>.json)이고,
# 페이지(/portal/npay/)가 브라우저에서 raw.githubusercontent.com 으로 필요한 파일만 읽는다.
concurrency:
  group: update-npay
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 마지막 갱신 확인
        id: fresh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          age=$(curl -s -m 30 "https://raw.githubusercontent.com/${{ github.repository }}/portal-npay/index.json" | head -c 600 | node -e "
            const s=require('fs').readFileSync(0,'utf8');const m=s.match(/\"updatedAt\":\"([^\"]+)\"/);
            const partial=/\"missingPages\":\[[0-9]/.test(s); // 일부 쪽이 빠진 자료면 6일을 기다리지 않고 다음 실행에서 다시 받는다
            console.log(m&&!partial?Math.floor((Date.now()-Date.parse(m[1]))/86400000):999)" 2>/dev/null || echo 999)
          echo "마지막 갱신 후 ${age}일"
          if [ "$FORCE" != "true" ] && [ "$age" -lt 6 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      # 수집이 실패하면 이 단계 출력 디렉터리가 없어 아래 게시 단계가 건너뛰어진다(이전 자료 그대로, 내일 다시 시도).
      - name: 비급여 진료비 수집(심평원 OpenAPI)
        if: steps.fresh.outputs.skip != 'true'
        id: collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if node scripts/fetch-npay.mjs "$RUNNER_TEMP/npay"; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "수집 실패 — 이전 자료를 그대로 두고 내일 다시 시도합니다."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      # 히스토리가 쌓이지 않게 매번 커밋 하나짜리 브랜치로 덮어쓴다(--force).
      - name: portal-npay 브랜치에 올리기
        if: steps.collect.outputs.ok == 'true'
        run: |
          cd "$RUNNER_TEMP/npay"
          git init -q -b portal-npay
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "비급여 진료비 자동 갱신"
          for i in 1 2 3 4 5; do
            if git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" portal-npay; then exit 0; fi
            echo "푸시 실패($i/5)"; sleep $((i * 15))
          done
          exit 1
