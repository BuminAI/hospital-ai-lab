name: Update SG Gov Notices

on:
  schedule:
    # 하루 3회(UTC 기준 :19 — KST 10:19/14:19/18:19 무렵). 연방 관보(Federal Register)의 HHS·FDA·CMS·FTC 신규 규칙·제안규칙은
    # 하루 몇 건 수준이라 뉴스만큼 자주 돌 이유가 없다. 다른 워크플로가 몰려 있는
    # 정각·:07·:17·:37·:47·:53은 비켜 둔다.
    - cron: '29 1,5,9 * * *'
  workflow_dispatch:

permissions:
  contents: write # 커밋·푸시
  actions: write # deploy.yml 수동 트리거(gh workflow run)

# 자기 자신의 중복 실행만 직렬화한다. deploy.yml의 'pages' 그룹이나 다른
# update-*.yml 그룹과 공유하지 않는다 — 공유하면 오너의 수동 배포 대기를
# 취소해 버릴 수 있다(update-sg-news.yml과 같은 이유).
concurrency:
  group: update-sg-gov
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 수집 실패(사이트 장애 등)는 오류로 남기지 않는다 — 파일이 안 바뀌므로
      # 아래 커밋 단계가 '변경 없음'으로 안전하게 끝난다.
      - name: 싱가포르판(영어) HSA 지침 문서 수집 (가이던스 문서 목록)
        run: node scripts/fetch-sg-gov.mjs || echo "수집 건너뜀(기존 목록 유지)"

      - name: 광폭 수집 (정부 지원사업·공고 — 각 나라 유명 매체 RSS 누적)
        run: node scripts/wide-collect.mjs sg gov || echo "광폭 수집 건너뜀(기존 목록 유지)"

      - name: sg/gov-notices.json 커밋 (변경 있을 때만)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sg/gov-notices.json
          if git diff --cached --quiet; then
            echo "새 공고 없음 — 커밋·배포 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "유지보수: 싱가포르판(영어) HSA 지침 자동 업데이트"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포 트리거 (deploy.yml)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
